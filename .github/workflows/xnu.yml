name: xnu

# Builds the patched XNU kernel on a GitHub-hosted macOS runner (free for public repositories).
# The kernel sources are not in this repository: blacktop/darwin-xnu-build downloads Apple's
# open-source XNU for the chosen macOS release and applies xnu/patches/ on top.

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, the iOS 16 generation)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}

jobs:
  host-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: QR log round trip
        run: |
          pip install opencv-python-headless numpy
          python3 tools/qr-log.py --selftest

  kernel:
    # macos-14 ships Xcode 15, whose iig matches the xnu-8796 IORPC ABI (Xcode 16's does not).
    # macos-13 was retired by GitHub in 2025 and never gets scheduled.
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the build script and add our patches
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/ 2>/dev/null || cp xnu/patches/*.patch dxb/patches/
          # libfirehose_kernel is built arm64e-only upstream; this kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh

      - name: Dependencies
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that `xcodes` exists; Xcode is preinstalled on the runner
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Locate sweet_ufs strategy line (diagnostic)
        run: |
          # Apply the patch series to a throwaway copy so the real build is
          # untouched, then report the line numbers we need to write a
          # late-numbered patch that inserts into sweet_ufs_strategy().
          rm -rf /tmp/dxbdump
          cp -R dxb /tmp/dxbdump
          cd /tmp/dxbdump
          # The XNU tree lives in dxb/xnu; stage scripts and patches both run
          # with that as the working directory (see the compiler paths).
          [ -d xnu ] && cd xnu
          # Stage scripts run BEFORE patches in the real build, and HFS only
          # exists after 0026-stage-hfs.sh, so run them here too.
          for s in patches/*.sh; do
            bash "$s" >/dev/null 2>&1 || true
          done
          # The tree layout differs between dxb revisions; try the usual
          # strip levels and ignore files that are not present yet.
          for p in patches/*.patch; do
            patch -p1 --forward -i "$p" >/dev/null 2>&1 \
              || patch -p2 --forward -i "$p" >/dev/null 2>&1 \
              || patch -p0 --forward -i "$p" >/dev/null 2>&1 || true
          done
          F=$(find . -name sweet_ufs.c | head -1)
          echo "=== ufs file: $F ==="
          if [ -n "$F" ]; then
            echo "=== strategy target ==="
            grep -n "error = ufs_read_blocks(su.first_block + lba, blocks);" "$F" || echo NOTFOUND
          fi
          H=$(find . -name hfs_readwrite.c | head -1)
          echo "=== hfs file: $H ==="
          if [ -n "$H" ]; then
            echo "=== SWEET BM3 anchor ==="
            grep -n "SWEET BM3" "$H" || echo NOTFOUND
            echo "=== lines 3420-3460 (tabs as ^I) ==="
            sed -n '3420,3460p' "$H" | sed -e 's/\t/^I/g'
            echo "=== lines 3420-3460 raw ==="
            sed -n '3420,3460p' "$H"
          fi

      - name: Build
        working-directory: dxb
        run: bash build.sh

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true
          # licence notices travel with the binaries (THIRD_PARTY.md rows 2,5,8,9; APSL asks for a source pointer)
          cp -R THIRD_PARTY.md LICENSES xnu/patches/NOTICE.md out/
          printf 'Source: %s/%s\nCommit: %s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > out/SOURCE.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
